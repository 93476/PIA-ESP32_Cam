name: Build Android APK

on:
  push:
    branches:
      - main
      - feat/unified-pia-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: |-
          gradle -p android-app testDebugUnitTest assembleDebug --stacktrace
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/pia_cam_v1.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pia_cam_v1
          path: android-app/app/build/outputs/apk/debug/pia_cam_v1.apk
          if-no-files-found: error
